function trn(n){
 if(n.nodeType==3){const t=n.nodeValue,k=t.trim();if(!k)return;let v=UR[k];if(v===undefined)for(const[r,x]of URX)if(r.test(k)){v=k.replace(r,x);break}if(v!==undefined)n.nodeValue=t.replace(k,v);return}
 if(n.nodeType!=1||/^(SCRIPT|STYLE)$/.test(n.tagName))return;
 if(n.tagName=="OPTION"&&!n.hasAttribute("value"))return;
 if(n.placeholder&&UR[n.placeholder])n.placeholder=UR[n.placeholder];
 n.childNodes.forEach(trn)}
